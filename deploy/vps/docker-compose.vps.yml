# SalesOS on a SHARED single VPS (prebuilt images, own Postgres/Redis/MinIO, hard CPU/memory caps so neighbours are never starved).
# Nothing is built on the server. Run from /srv/salesos:
#   docker compose -p salesos -f docker-compose.vps.yml --env-file .env.infra up -d postgres redis minio
#   docker compose -p salesos -f docker-compose.vps.yml --env-file .env.infra --profile ops run --rm migrate
#   docker compose -p salesos -f docker-compose.vps.yml --env-file .env.infra up -d api worker web
# Only api (127.0.0.1:4100) and web (127.0.0.1:3100) publish a host port, both loopback. Infra is reachable only on the private network.
name: salesos

x-app: &app
  restart: unless-stopped
  env_file: [.env.production]
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  cpu_shares: 256 # lower scheduling weight than the other sites when the CPU is contended
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  networks: [app]

services:
  postgres:
    image: postgres:16-alpine
    container_name: salesos-postgres
    restart: unless-stopped
    environment: { POSTGRES_USER: "${PG_ADMIN_USER}", POSTGRES_PASSWORD: "${PG_ADMIN_PASSWORD}", POSTGRES_DB: salesos }
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "effective_cache_size=256MB", "-c", "max_connections=60", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=48MB"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [app]
    cpu_shares: 256
    mem_limit: 512m
    cpus: 0.75
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d salesos"], interval: 10s, timeout: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    container_name: salesos-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redisdata:/data"]
    networks: [app]
    cpu_shares: 256
    mem_limit: 160m
    cpus: 0.25
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"], interval: 10s, timeout: 3s, retries: 10 }
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }

  minio:
    image: "${MINIO_IMAGE}"
    container_name: salesos-minio
    restart: unless-stopped
    command: ["server", "/data"]
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}" }
    volumes: ["miniodata:/data"]
    networks: [app]
    cpu_shares: 128
    mem_limit: 256m
    cpus: 0.25
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  api:
    <<: *app
    image: salesos-api:${RELEASE}
    container_name: salesos-api
    environment: { NODE_ENV: production, PORT: "4100", RELEASE: "${RELEASE}" }
    ports: ["127.0.0.1:4100:4100"]
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.0
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }

  worker:
    <<: *app
    image: salesos-worker:${RELEASE}
    container_name: salesos-worker
    environment: { NODE_ENV: production, RELEASE: "${RELEASE}" }
    stop_grace_period: 40s
    mem_limit: 512m
    cpus: 0.5
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }

  web:
    <<: *app
    image: salesos-web:${RELEASE}
    container_name: salesos-web
    environment: { NODE_ENV: production, PORT: "3100" }
    ports: ["127.0.0.1:3100:3100"]
    tmpfs: ["/tmp", "/app/apps/web/.next/cache"]
    mem_limit: 384m
    cpus: 0.5

  # One-off, run manually after a verified backup. DATABASE_URL is replaced by MIGRATE_DATABASE_URL (the schema-owning role).
  migrate:
    image: salesos-tools:${RELEASE}
    container_name: salesos-migrate
    profiles: ["ops"]
    command: ["migrate"]
    env_file: [.env.production]
    environment: { DATABASE_URL: "${MIGRATE_DATABASE_URL}" }
    networks: [app]
    mem_limit: 768m
    cpus: 1.0

networks:
  app: {}
volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
